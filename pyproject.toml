[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "part-vector-credit"
version = "0.1.0"
description = "A falsifiable pART/SMART-inspired test of vectorized dendritic credit assignment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OgnjenX"}]
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "brian2>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
part-credit = "part_credit.cli:main"
part-credit-exp001 = "part_credit.exp001.cli:main"
part-credit-exp002 = "part_credit.exp002.cli:main"
part-credit-exp003a = "part_credit.exp003a.cli:main"
part-credit-exp003b = "part_credit.exp003b.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
